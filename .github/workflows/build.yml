name: Build, verify and deploy

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify output
        run: |
          set -euo pipefail
          # 每個 src/**/index.njk 都要有對應的 _site 產出（新頁面自動納入驗證，無需改此清單）
          fail=0
          while IFS= read -r f; do
            rel="${f#src/}"; out="${rel%.njk}.html"
            test -f "_site/$out" || { echo "缺少輸出：$out"; fail=1; }
          done < <(find src -name 'index.njk' | sort)
          [ "$fail" -eq 0 ] || exit 1
          if grep -rIl "<style" _site --include="*.html"; then
            echo "頁面不應含有內嵌 <style>"; exit 1
          fi
          echo "驗證通過：全部頁面有產出、無內嵌樣式"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4