name: Build, verify and deploy

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify output
        run: |
          set -euo pipefail
          for p in index.html about/index.html learn/index.html learn/car-accident/index.html \
                   qa/index.html tools/index.html tools/compulsory-insurance/index.html \
                   tools/mobile-scan/index.html tools/road-rescue/index.html; do
            test -f "_site/$p" || { echo "缺少輸出：$p"; exit 1; }
          done
          if grep -rIl "<style" _site --include="*.html"; then
            echo "頁面不應含有內嵌 <style>"; exit 1
          fi
          echo "驗證通過：9 頁輸出、無內嵌樣式"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4